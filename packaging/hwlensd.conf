# hwlensd settings. Restart the daemon after a change: sudo systemctl restart hwlensd

# Collection interval in milliseconds (100 to 86400000). Clients may change it with the "options" request.
#update_ms = 1000

# ERROR, WARNING, INFO or DEBUG. The --log-level option of the service overrides it.
#log_level = WARNING

# Days of per-minute history kept in /var/lib/hwlensd/history.jsonl (0 turns it off, at most 366).
# About 1 MiB per day.
#history_days = 7
